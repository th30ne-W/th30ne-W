name: calendar
on:
  schedule: [{cron: "17 5 * * *"}]
  workflow_dispatch:
permissions: {contents: write, actions: write}
concurrency: {group: calendar, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: "3.12"}
      - name: Render calendar
        env: {GH_TOKEN: "${{ secrets.PROFILE_CONTRIB_TOKEN || github.token }}"}
        run: python -m generator calendar --login th30ne-W --out assets/calendar
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/calendar
          git diff --cached --quiet || { git commit -m "chore: refresh contribution calendar"; git pull --rebase; git push; }
      - name: Keep workflow enabled
        if: github.event_name == 'schedule'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: '[ "$(date -u +%d)" = "01" ] && gh workflow enable calendar.yml || true'
